; Local development settings for the Terra & Thread container.
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
expose_php = Off
; WordPress logs to logs/debug.log (WP_DEBUG_LOG); keep PHP errors out of the pages.
display_errors = Off

; Code is bind-mounted and edited live, so check file timestamps on every request.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
