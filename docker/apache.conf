ServerName localhost

<VirtualHost *:80>
	DocumentRoot /var/www/project/public

	<Directory /var/www/project/public>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted

		# Pretty permalinks: anything that isn't a real file or folder goes to WordPress.
		RewriteEngine On
		RewriteBase /
		RewriteRule ^index\.php$ - [L]
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule . /index.php [L]
	</Directory>

	# Same protections as bin/router.php: no dotfiles, no config, and no PHP served directly
	# from wp-content (drop-ins, plugin and theme internals).
	<LocationMatch "/\.">
		Require all denied
	</LocationMatch>
	<Files "wp-config.php">
		Require all denied
	</Files>
	<LocationMatch "^/wp-content/.*\.php$">
		Require all denied
	</LocationMatch>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
